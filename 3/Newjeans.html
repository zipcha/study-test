<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NewJeans</title>
    <link rel="stylesheet" href="./NewJeans.css" />
  </head>
  <body>
    <header>
      <div class="head-wrap">
        <img
          class="download"
          src="./assets/btn-download.png"
          alt="btn-download"
        />
        <div class="right-wrap">
          <p class="cookie">COOKIE POLICY</p>
          <div class="images-wrap">
            <a href="https://www.youtube.com/c/NewJeans_official">
              <img
                class="logo"
                src="./assets/youtube-logo.png"
                alt="youtube-logo"
              />
            </a>
            <a href="https://x.com/NewJeans_ADOR">
              <img class="logo" src="./assets/x-logo.png" alt="x-logo"
            /></a>
            <a href="https://www.instagram.com/newjeans_official/">
              <img
                class="logo"
                src="./assets/instagram-logo.png"
                alt="instagram-logo"
              />
            </a>
            <a href="https://www.facebook.com/official.newjeans">
              <img
                class="logo"
                src="./assets/facebook-logo.png"
                alt="facebook-logo"
              />
            </a>
          </div>
        </div>
      </div>
    </header>
    <div class="content">
      <main>
        <div class="wrapper">
          <!-- 안에는 자동 이미지 슬라이더가 들어갈 예정 -->
        </div>
      </main>
      <aside>
        <img class="logo" src="./assets/logo.png" alt="logo" />
      </aside>
    </div>
    <footer>
      <p class="copyright">© 2026 ADOR . All Rights Reserved</p>
    </footer>
  </body>
</html>
